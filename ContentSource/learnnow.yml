routes:
  # —— 课程一：计算机基础（5 单元 / 24 课）——
  - id: cs-basics
    title: 计算机基础
    subtitle: 信息 · 思维 · 程序 · 数据 · 内存
    systemImage: cpu
    accent: purple
    cta: 开始学习
    interactive: true
    tracks:
      - id: cs-info-track
        title: 计算机与信息
        lessons:
          - lessons/cs-info-task/lesson.yml
          - lessons/cs-info-why-represent/lesson.yml
          - lessons/cs-info-binary/lesson.yml
          - lessons/cs-info-together/lesson.yml
      - id: cs-thinking-track
        title: 计算思维
        lessons:
          - lessons/cs-thinking-decompose/lesson.yml
          - lessons/cs-thinking-control/lesson.yml
          - lessons/cs-thinking-describe/lesson.yml
          - lessons/cs-thinking-correctness/lesson.yml
      - id: cs-programming-track
        title: 程序设计原理
        lessons:
          - lessons/cs-prog-language/lesson.yml
          - lessons/cs-prog-variables/lesson.yml
          - lessons/cs-prog-control/lesson.yml
          - lessons/cs-prog-functions/lesson.yml
          - lessons/cs-prog-debug/lesson.yml
      - id: cs-data-algo-track
        title: 数据与算法
        lessons:
          - lessons/cs-data-array/lesson.yml
          - lessons/cs-data-string/lesson.yml
          - lessons/cs-data-search/lesson.yml
          - lessons/cs-data-sort/lesson.yml
          - lessons/cs-data-efficiency/lesson.yml
      - id: cs-memory-ds-track
