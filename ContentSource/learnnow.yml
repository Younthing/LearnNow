          - lessons/db-rel-fk/lesson.yml
          - lessons/db-rel-cardinality/lesson.yml
          - lessons/db-rel-join/lesson.yml
          - lessons/db-rel-dup/lesson.yml
      - id: db-reliability-track
        title: 数据库的可靠性
        lessons:
          - lessons/db-reli-index/lesson.yml
          - lessons/db-reli-cost/lesson.yml
          - lessons/db-reli-tx/lesson.yml
          - lessons/db-reli-atomic/lesson.yml
          - lessons/db-reli-backup/lesson.yml

