          - lessons/db-design-pk/lesson.yml
          - lessons/db-design-null/lesson.yml
          - lessons/db-design-dup/lesson.yml
      - id: db-sql-track
        title: SQL 基础操作
        lessons:
          - lessons/db-sql-create/lesson.yml
          - lessons/db-sql-insert/lesson.yml
          - lessons/db-sql-select/lesson.yml
          - lessons/db-sql-update/lesson.yml
          - lessons/db-sql-delete/lesson.yml
      - id: db-query-track
        title: 查询与统计
        lessons:
          - lessons/db-query-where/lesson.yml
          - lessons/db-query-order/lesson.yml
          - lessons/db-query-group/lesson.yml
          - lessons/db-query-agg/lesson.yml
          - lessons/db-query-sub/lesson.yml
      - id: db-relations-track
        title: 多表关系
        lessons:
