          - lessons/py-traceback/lesson.yml
          - lessons/py-except/lesson.yml
          - lessons/py-test/lesson.yml
          - lessons/py-stdlib/lesson.yml

  # —— 课程三：数据库基础（6 单元 / 29 课）——
  - id: db-basics
    title: 数据库基础
    subtitle: 认识 · 设计 · SQL · 查询 · 关系 · 可靠
    systemImage: chart.bar.xaxis
    accent: amber
    cta: 开始学习
    interactive: true
    tracks:
      - id: db-intro-track
        title: 认识数据库
        lessons:
          - lessons/db-intro-files/lesson.yml
          - lessons/db-intro-dbms/lesson.yml
          - lessons/db-intro-relational/lesson.yml
          - lessons/db-intro-table/lesson.yml
      - id: db-design-track
