          - lessons/cs-mem-org-efficiency/lesson.yml

  # —— 课程二：Python 基础（6 单元 / 27 课）——
  - id: py-basics
    title: Python 基础
    subtitle: 语法 · 流程 · 函数 · 结构 · 文件 · 错误
    systemImage: chevron.left.forwardslash.chevron.right
    accent: blue
    cta: 开始学习
    interactive: true
    tracks:
      - id: py-start-track
        title: 开始使用 Python
        lessons:
          - lessons/py-run/lesson.yml
          - lessons/py-io/lesson.yml
          - lessons/py-var/lesson.yml
          - lessons/py-types/lesson.yml
      - id: py-control-track
        title: 控制程序流程
        lessons:
          - lessons/py-if/lesson.yml
          - lessons/py-loop/lesson.yml
          - lessons/py-loop-ctrl/lesson.yml
          - lessons/py-nest/lesson.yml
      - id: py-functions-track
        title: 函数与程序组织
        lessons:
          - lessons/py-why-fn/lesson.yml
          - lessons/py-args-ret/lesson.yml
          - lessons/py-scope/lesson.yml
          - lessons/py-mod-files/lesson.yml
      - id: py-structures-track
        title: 常用数据结构
        lessons:
          - lessons/py-list/lesson.yml
          - lessons/py-tuple/lesson.yml
          - lessons/py-dict/lesson.yml
          - lessons/py-set/lesson.yml
          - lessons/py-iter/lesson.yml
      - id: py-files-track
        title: 文本与文件
        lessons:
